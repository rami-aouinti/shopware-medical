global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: shopware-medical-inventory
    metrics_path: /api/_action/medical-inventory/metrics
    scrape_interval: 30s
    oauth2:
      client_id: ${SHOPWARE_MONITORING_CLIENT_ID}
      client_secret: ${SHOPWARE_MONITORING_CLIENT_SECRET}
      token_url: http://web:8000/api/oauth/token
    static_configs:
      - targets: ["web:8000"]
        labels: {application: medical-shopware, plugin: MedicalInventory}
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: node-exporter
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889"]}]
