# This file is managed by shopware-cli. Do not edit manually.
# Create a compose.override.yaml to customize services.
# See https://docs.docker.com/compose/how-tos/multiple-compose-files/merge/

services:
    web:
        image: ghcr.io/shopware/docker-dev:php8.5-node24-caddy
        user: 1000:1000
        ports:
            - 8000:8000
            - 8080:8080
            - 9999:9999
            - 9998:9998
            - 5173:5173
            - 5773:5773
        env_file:
            - .env.local
        environment:
            APP_ENV: xxxxxxx
            APP_DEBUG: "1"
            HOST: 0.0.0.0
            DATABASE_URL: mysql://root:root@database/shopware
            MAILER_DSN: smtp://mailer:1025
            TRUSTED_PROXIES: REMOTE_ADDR
            SYMFONY_TRUSTED_PROXIES: REMOTE_ADDR
            MESSENGER_TRANSPORT_DSN: amqp://guest:guest@queue:5672
            OPENSEARCH_URL: http://search:9200
            SHOPWARE_ES_ENABLED: "1"
            SHOPWARE_ES_INDEXING_ENABLED: "1"
            SHOPWARE_ES_INDEX_PREFIX: sw
        volumes:
            - .:/var/www/html
        depends_on:
            database:
                condition: service_healthy
    database:
        image: mariadb:11.8
        command:
            - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
            - --log_bin_trust_function_creators=1
            - --binlog_cache_size=16M
            - --key_buffer_size=0
            - --join_buffer_size=1024M
            - --innodb_log_file_size=128M
            - --innodb_buffer_pool_size=1024M
            - --innodb_buffer_pool_instances=1
            - --group_concat_max_len=320000
            - --default-time-zone=+00:00
            - --max_binlog_size=512M
            - --binlog_expire_logs_seconds=86400
        ports:
            - 127.0.0.1::3306
        environment:
            MARIADB_DATABASE: shopware
            MARIADB_ROOT_PASSWORD: root
            MARIADB_USER: shopware
            MARIADB_PASSWORD: shopware
        volumes:
            - db-data:/var/lib/mysql:rw
        healthcheck:
            test:
                - CMD
                - mariadb-admin
                - ping
                - -h
                - localhost
                - -proot
            start_period: 10s
            start_interval: 3s
            interval: 5s
            timeout: 1s
            retries: 10
    adminer:
        image: adminer
        ports:
            - 9080:8080
        environment:
            ADMINER_DEFAULT_SERVER: database
        depends_on:
            database:
                condition: service_started
        stop_signal: SIGKILL
    mailer:
        image: axllent/mailpit
        ports:
            - 1025:1025
            - 8025:8025
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    queue:
        image: cloudamqp/lavinmq:latest
        ports:
            - 127.0.0.1:15672:15672
            - 127.0.0.1:5672:5672
        volumes:
            - lavinmq-data:/var/lib/lavinmq:rw
    search:
        image: opensearchproject/opensearch:2
        ports:
            - 127.0.0.1:9200:9200
        environment:
            OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Shopware123!"
            discovery.type: single-node
            plugins.security.disabled: "true"
        volumes:
            - opensearch-data:/usr/share/opensearch/data
volumes:
    db-data: {}
    lavinmq-data: {}
    opensearch-data: {}
