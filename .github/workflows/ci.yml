name: MedicalInventory CI

on:
  push:
    branches:
      - dev
      - staging
      - master
  pull_request:
    branches:
      - dev
      - staging
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP 8.5 / Shopware 6.7 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      COMPOSER_MAX_PARALLEL_HTTP: 4
      COMPOSER_PROCESS_TIMEOUT: 900

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pdo_mysql, simplexml, sodium, tokenizer, xml, xmlwriter, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish --no-check-lock

      # The committed lock file predates the new require-dev tools.
      # Retry transient Packagist/CDN failures while resolving the updated lock.
      - name: Resolve project and quality dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if composer update --no-interaction --prefer-dist --no-progress --no-scripts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Composer update failed (attempt $attempt/3); retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1

      - name: Build optimized autoloader
        run: composer dump-autoload --optimize --no-interaction

      - name: Run all quality gates and unit tests
        run: composer quality
