name: MedicalInventory CI

on:
  push:
    branches:
      - dev
      - staging
      - master
  pull_request:
    branches:
      - dev
      - staging
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP 8.5 / Shopware 6.7 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: medical_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      APP_DEBUG: 1
      APP_SECRET: medical-inventory-ci-secret
      MEDICAL_INVENTORY_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/medical_inventory_test?serverVersion=mariadb-11.4.0
      COMPOSER_MAX_PARALLEL_HTTP: 4
      COMPOSER_PROCESS_TIMEOUT: 900
      COMPOSER_MEMORY_LIMIT: -1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pdo_mysql, simplexml, sodium, tokenizer, xml, xmlwriter, zip
          coverage: none
          cache: composer

      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --optimize-autoloader

      - name: Check PHP coding standard
        run: composer cs:check

      - name: Check PHP-CS-Fixer formatting
        run: composer cs:fix:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Psalm
        run: composer psalm

      - name: Run PHPMD
        run: composer mess-detector

      - name: Run PHPInsights
        run: composer insights

      - name: Run Rector dry-run
        run: composer rector:check

      - name: Run plugin unit tests
        run: composer test:plugin

      - name: Run MariaDB and Shopware DAL integration tests
        run: composer test:integration
